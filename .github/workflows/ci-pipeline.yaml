name: portfolio-ci-pipeline


on:
  push:
    branches: ["main"]

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  buildDocker:
    runs-on: ubuntu-latest


    steps:
      - name: checkout the source Code
        uses: actions/checkout@v4
      
      - name: configure node packeges
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: install dependences
        run: npm install

      - name: build packages
        run: npm run build

      - name: Configuredocker buildx
        uses: docker/setup-buildx-action@v4

## Login TO DockerHub
      - name: Login To Docker
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
## Login TO GiTHubRegistry
      - name:  Login To GHCR
        uses:  docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

## authinticate Aws
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
           role-to-assume: ${{ vars.AWS_ROLE_ARN }}
           aws-region: ${{vars.AWS_REGION_NAME}}
      
## verify Aws Identity
      - name: Verify AWS Identity
        run: aws sts get-caller-identity


## Login To the ecr
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set lowercase GitHub username
        run: echo "GHCR_OWNER=$(echo '${{ github.actor }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      
## build and push Docker image
      - name: build and push Docker image 
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
             ${{ secrets.DOCKERHUB_USERNAME}}/portfolio:${{ github.sha }}
             ghcr.io/${{ env.GHCR_OWNER }}/portfolio:${{ github.sha }}
             ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
      



       
