name: PORTFOLIO-CD-PIPELINE


on:
  workflow_run:
    workflows: ["CI-PIPELINE"]
    types: [completed]

 
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Production EC2
    runs-on: ubuntu-latest
 # Only deploy when CI succeeds
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{vars.AWS_REGION_NAME}}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup SSh
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{secrets.EC2_SSH_KEY}}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{secrets.AWS_EC2IP}}" >> ~/.ssh/known_hosts


      
      - name: Deploy On AWS
        env:
          AWS_EC2IP: ${{ secrets.AWS_EC2IP }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

        run: |
          ssh -i ~/.ssh/ec2_key \
          "$EC2_USER@$AWS_EC2IP" 'bash -se' <<EOF

            set -e

            echo "Updating Ubuntu packages..."
            sudo apt update

            echo "Installing Docker..."
            sudo apt install -y docker.io

            echo "Starting Docker..."
            sudo systemctl enable --now docker

            echo "Pulling Docker image..."
            sudo docker pull ${DOCKERHUB_USERNAME}/test-portfolio:${IMAGE_TAG}

            echo "Stopping old container..."
            sudo docker rm -f portfolio 2>/dev/null || true

            echo "Starting new container..."
            sudo docker run -d \
              --name portfolio \
              --restart unless-stopped \
              -p 3000:3000 \
              ${DOCKERHUB_USERNAME}/test-portfolio:${IMAGE_TAG}

            echo "Deployment completed successfully!"

          EOF

      

      - name: Deployment Success
        run: |
          echo "===================================="
          echo "  DEPLOYMENT SUCCESSFUL!"
          echo "  Application deployed on AWS EC2"
          echo "  Docker container is running"
          echo "===================================="