name: PORTFOLIO-CD-PIPELINE


on:
  workflow_run:
    workflows: ["CI-PIPELINE"]
    types: [completed]

 
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Production EC2
    runs-on: ubuntu-latest
 # Only deploy when CI succeeds
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{vars.AWS_REGION_NAME}}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup SSh
        run: |
          mkdir -p ~/.ssh
          echo "${{secrets.EC2_SSH_KEY}}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{secrets.EC2_HOST}}" >> ~/.ssh/known_hosts


      - name: Deploy On AWS
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh -i ~/.ssh/ec2_key ${{secrets.EC2_USER}}@${{secrets.EC2_HOST}} \

          'sudo apt update &&
           sudo apt install -y docker.io &&
           sudo systemctl enable docker &&
           sudo systemctl start docker &&
           sudo docker pull '$DOCKERHUB_USERNAME/test-portfolio:$IMAGE_TAG' &&
           sudo docker stop portfolio || true"
          '
      

      - name: Deployment Success
        run: |
          echo "===================================="
          echo "  DEPLOYMENT SUCCESSFUL!"
          echo "  Application deployed on AWS EC2"
          echo "  Docker container is running"
          echo "===================================="