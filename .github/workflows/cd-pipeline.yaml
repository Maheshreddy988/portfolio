name: PORTFOLIO-CD-PIPELINE

on:
  workflow_run:
    workflows: ["CI-PIPELINE"]
    types: [completed]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Production EC2
    runs-on: ubuntu-latest

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Debug GitHub OIDC Claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            core.info(`OIDC sub: ${payload.sub}`);
            core.info(`OIDC aud: ${JSON.stringify(payload.aud)}`);
            core.info(`Repository: ${payload.repository}`);
            core.info(`Repository ID: ${payload.repository_id}`);
            core.info(`Owner ID: ${payload.repository_owner_id}`);
            core.info(`Ref: ${payload.ref}`);

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION_NAME }}
          role-session-name: Portfolio-CD-${{ github.run_id }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity